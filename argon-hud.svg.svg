<svg viewBox="0 0 1000 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-width="0.3" stroke-opacity="0.2" />
    </pattern>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: url(#cyberGrad); stroke-width: 3; }
      .scanline { fill: url(#cyberGrad); opacity: 0.18; animation: scan 4s linear infinite; }
      .title { font-family: 'Courier New', monospace; font-weight: 900; font-size: 30px; fill: #00E5FF; letter-spacing: 3px; }
      .sub { font-family: 'Courier New', monospace; font-size: 14px; fill: #FF007F; letter-spacing: 2px; }
      .meta { font-family: 'Courier New', monospace; font-size: 12px; fill: #25D366; }
      .pulse-ring { fill: none; stroke: #00E5FF; stroke-width: 2; transform-origin: 880px 110px; animation: pulse 2.5s ease-out infinite; }
      .core-ring { fill: none; stroke: #FF007F; stroke-width: 2.5; stroke-dasharray: 18 8; transform-origin: 880px 110px; animation: spin 8s linear infinite; }
      @keyframes scan { 0% { transform: translateY(-220px); } 100% { transform: translateY(220px); } }
      @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="1000" height="220" rx="14" class="bg" />
  <rect width="1000" height="220" rx="14" fill="url(#grid)" />
  <rect width="1000" height="45" class="scanline" />
  <rect x="4" y="4" width="992" height="212" rx="12" class="frame" />
  <text x="40" y="42" class="meta">>_ SYS.NODE: FAISAL_AHMMED // ARGON_CORE_v9.4 [ONLINE]</text>
  <text x="40" y="95" class="title">NEURAL & CLOUD ARCHITECTURE</text>
  <text x="40" y="130" class="sub">[ NEXT.JS • ASP.NET CORE • FLUTTER • GRAD-CAM++ XAI • GCP ]</text>
  <text x="40" y="175" class="meta">STATUS: ALL MICROSERVICES NOMINAL  |  CLEARANCE: LEVEL_9  |  LATENCY: 12ms</text>
  <circle cx="880" cy="110" r="45" class="pulse-ring" />
  <circle cx="880" cy="110" r="38" class="core-ring" />
  <circle cx="880" cy="110" r="10" fill="#00E5FF" />
</svg>