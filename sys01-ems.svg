      @keyframes w1 { 0% { width: 120px; } 100% { width: 220px; } }
      @keyframes w2 { 0% { width: 180px; } 100% { width: 250px; } }
      @keyframes w3 { 0% { width: 90px; } 100% { width: 190px; } }
      @keyframes blk { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
