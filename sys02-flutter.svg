<svg viewBox="0 0 600 320" width="100%" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00E5FF" stroke-width="0.3" stroke-opacity="0.25" />
    </pattern>
    <style>
      .bg { fill: #0D1117; }
